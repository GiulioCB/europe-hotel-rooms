name: Weekly European hotel collection
on:
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotel-database
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test extraction and data handling
        run: python -m unittest discover -s tests -v
      - name: Collect the next country and research room totals
        id: collect
        continue-on-error: true
        run: python collector.py --enrich-limit 200 --minutes 35
      - name: Save data and checkpoints even after source failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data exports
          if ! git diff --cached --quiet; then
            git commit -m 'Update hotel observations and collection progress'
            git push
          fi
      - name: Report a failed country import
        if: steps.collect.outcome == 'failure'
        run: exit 1
