name: Validate collection code
on:
  push:
    branches: [main]
    paths: ['**.py', '**.js', '**.mjs', 'config/**', 'tests/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.py', '**.js', '**.mjs', 'config/**', 'tests/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/accommodation-csv.test.js
