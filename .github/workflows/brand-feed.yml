name: Refresh requested brand feed
on:
  push:
    branches: [main]
    paths:
      - config/requested-brands.json
      - src/brand-matching.js
      - scripts/brand-feed.mjs
      - .github/workflows/brand-feed.yml
  workflow_run:
    workflows: [Weekly European hotel collection, Free Google hotel discovery across Europe]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hotel-export-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match the supplied brands and retain room evidence
        run: node scripts/brand-feed.mjs
      - name: Publish the map and list feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/branded-hotels.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Update requested-brand hotel observations'
            git pull --rebase origin main
            git push
          fi
