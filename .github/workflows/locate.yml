name: Locate existing hotels
on:
  workflow_dispatch:
  schedule:
    - cron: '12 4 * * *'
permissions:
  contents: write
concurrency:
  group: hotel-export-writer
  cancel-in-progress: false
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing addresses and update map exports
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          python scripts/locate_existing.py --coverage >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$GEOAPIFY_API_KEY" ]; then echo "Geocoding pending Geoapify key" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python scripts/locate_existing.py
          if git diff --quiet -- data; then exit 0; fi
          python collector.py --export-only
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data exports
          git commit -m "Locate existing hotels with verified address matches"
          git push
