name: Publish brand discovery catalogue
on:
  push:
    branches: [main]
    paths:
      - scripts/discover-hotelier-brands.py
      - tests/test_brand_discovery.py
      - .github/workflows/brand-discovery.yml
  schedule:
    - cron: '41 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hotel-export-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery and CSV safety
        run: python -m unittest discover -s tests -p test_brand_discovery.py -v
      - name: Refresh bounded Hotelier.de discovery index
        run: python scripts/discover-hotelier-brands.py
      - name: Publish review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/brand-discovery/hotelier.json exports/brand-discovery.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Hotelier.de brand discovery candidates'
            git pull --rebase origin main
            git push
          fi
